# Production: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Aplikasi hanya terbuka di 127.0.0.1:3000 — pasang reverse proxy HTTPS (Caddy/Nginx) di depannya.
name: cuti-esdm

x-db-env: &db-env
  PGHOST: db
  PGUSER: ${POSTGRES_USER}
  PGPASSWORD: ${POSTGRES_PASSWORD}
  PGDATABASE: ${POSTGRES_DB}
  TZ: Asia/Makassar

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Makassar
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Migrasi skema setiap deploy (idempoten), lalu selesai.
  migrate:
    build: { context: ., target: migrator }
    env_file: .env.production
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env.production
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_DIR: /data/berkas
    volumes:
      - berkas:/data/berkas
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      gotenberg: { condition: service_started }

  # HTML → PDF dan DOCX/XLSX → PDF; hanya di jaringan internal.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # Tugas terjadwal: tandai Alpa, selesaikan cuti, kirim antrean email (tiap 10 menit).
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      TUGAS_TOKEN: ${TUGAS_TOKEN}
    entrypoint: ["/bin/sh", "-c", "while true; do curl -fsS -X POST -H \"Authorization: Bearer $$TUGAS_TOKEN\" http://app:3000/api/tugas/harian || echo 'tugas harian gagal'; sleep 600; done"]
    depends_on: [app]

  # Backup harian database + berkas unggahan, disimpan RETENSI_HARI hari.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      RETENSI_HARI: ${RETENSI_HARI:-14}
      JAM_BACKUP: ${JAM_BACKUP:-01}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - berkas:/data/berkas:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
  berkas:
